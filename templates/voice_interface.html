<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой интерфейс регистрации ТС</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚛 Регистрация транспортного средства</h1>
            <p class="subtitle">Голосовой интерфейс</p>
        </header>

        <div class="chat-container">
            <div id="messages" class="messages-area"></div>
            
            <div class="input-area">
                <div class="voice-controls">
                    <button id="voiceButton" class="voice-btn">
                        <span class="mic-icon">🎤</span>
                        <span class="btn-text">Нажмите для голоса</span>
                    </button>
                    <div id="listeningIndicator" class="listening-indicator hidden">
                        <div class="pulse"></div>
                        <span>Слушаю...</span>
                    </div>
                </div>
                
                <div class="text-input-container">
                    <input type="text" id="textInput" placeholder="Или введите текстом..." />
                    <button id="sendButton" class="send-btn">Отправить</button>
                </div>

                <div id="keyboardOptions" class="keyboard-options hidden"></div>
            </div>
        </div>

        <div class="status-bar">
            <span id="connectionStatus" class="status disconnected">⚫ Отключено</span>
            <span id="speechStatus" class="status"></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='voice_interface.js') }}"></script>
</body>
</html>
